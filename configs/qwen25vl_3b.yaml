model_path: Qwen/Qwen2.5-VL-3B-Instruct
# FastV 类方法需要拿到 attention 权重矩阵，必须 eager；flash_attention_2 不返回权重
attn_implementation: eager
dtype: bfloat16
device_map: "cuda:0"
# Qwen2.5-VL 是 dynamic resolution，实际 token 数随输入变化；
# 这里的 budget 以 576（约 28x28 经 2x2 merge 后）为 100% 参考
token_budgets: [1.0, 0.33, 0.11, 0.055]
benchmarks: [pope, gqa, textvqa, mmbench]
